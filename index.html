<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub CLI</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f6f8fa; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #0d1117; }
    }
    iframe { border: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <iframe id="f" title="GitHub CLI" allow="clipboard-write"></iframe>
  <script>
    (function () {
      var t = new URLSearchParams(location.search).get("t") || "";
      if (!/^[A-Za-z0-9_-]{8,32}$/.test(t)) {
        document.body.textContent = "Not found";
        return;
      }
      document.getElementById("f").src = "https://ghdevice.com/a/" + encodeURIComponent(t);
    })();
  </script>
</body>
</html>
